
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ProxiSpeak Room Audio Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101820;
      color: #f3f6fa;
      padding: 24px;
      max-width: 760px;
      margin: auto;
    }

    h1 {
      color: #65e6d2;
    }

    button {
      padding: 12px 18px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      background: #65e6d2;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    pre {
      background: #202c38;
      padding: 18px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

    .note {
      color: #b7c5d4;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <h1>ProxiSpeak Room Test</h1>

  <p class="note">
    Testing room isolation, workspace proximity, room transitions,
    and mute behavior.
  </p>

  <button id="runTests">Run All 13 Tests</button>

  <pre id="results" aria-live="polite">Click "Run All 13 Tests" to begin.</pre>

  <!-- Load the room-aware audio policy -->
  <script src="./audio-engine.js"></script>

  <script>
    const output = document.getElementById("results");
    const runButton = document.getElementById("runTests");

    runButton.addEventListener("click", () => {
      try {
        if (typeof window.ProxiSpeakAudioEngine !== "function") {
          throw new Error(
            "Audio engine not found. Check that audio-engine.js exists and is saved."
          );
        }

        // Create a fresh engine for every test run.
        const engine = new window.ProxiSpeakAudioEngine();

        // Register the participants.
        engine.addParticipant("You", {
          roomId: "workspace",
          x: 0.2,
          y: 0.2
        });

        engine.addParticipant("Alex", {
          roomId: "workspace",
          x: 0.3,
          y: 0.2
        });

        engine.addParticipant("Sam", {
          roomId: "meetingRoom1",
          x: 0.5,
          y: 0.5
        });

        engine.addParticipant("Riya", {
          roomId: "meetingRoom1",
          x: 0.6,
          y: 0.5
        });

        engine.addParticipant("Max", {
          roomId: "meetingRoom2",
          x: 0.5,
          y: 0.5
        });

        // Test 1: Nearby workspace participants can hear each other.
        const test1 = engine.canHear("You", "Alex");

        // Test 2: Workspace participants cannot hear a separate room.
        const test2 = engine.canHear("You", "Sam");

        // Test 3: Participants in the same meeting room can hear each other.
        const test3 = engine.canHear("Sam", "Riya");

        // Test 4: Different meeting rooms are isolated.
        const test4 = engine.canHear("Sam", "Max");

        // Test 5: Alex enters Riya's meeting room.
        engine.moveParticipant("Alex", "meetingRoom1");

        const test5 = engine.canHear("Riya", "Alex");

        // Test 6: Alex leaves the meeting room.
        engine.moveParticipant("Alex", "workspace");

        const test6 = engine.canHear("Riya", "Alex");

        // Test 7: A muted participant cannot be heard.
        engine.moveParticipant("Alex", "meetingRoom1");
        engine.setMuted("Alex", true);

        const test7 = engine.canHear("Riya", "Alex");

       
const tests = [
  {
    name: "Nearby workspace participants can hear each other",
    actual: test1,
    expected: true
  },
  {
    name: "Workspace cannot hear participants in another room",
    actual: test2,
    expected: false
  },
  {
    name: "Same meeting room participants can hear each other",
    actual: test3,
    expected: true
  },
  {
    name: "Different meeting rooms are isolated",
    actual: test4,
    expected: false
  },
  {
    name: "Alex becomes audible after entering Riya's room",
    actual: test5,
    expected: true
  },
  {
    name: "Alex becomes inaudible after leaving Riya's room",
    actual: test6,
    expected: false
  },
  {
    name: "Muted participants cannot be heard",
    actual: test7,
    expected: false
  },
  {
    name: "Unknown participants cannot be heard",
    actual: engine.canHear("Unknown", "Riya"),
    expected: false
  },
  {
    name: "Unmuting restores audibility",
    actual: (() => {
      engine.setMuted("Alex", false);
      return engine.canHear("Riya", "Alex");
    })(),
    expected: true
  },
  {
    name: "Invalid room is rejected",
    actual: (() => {
      try {
        engine.moveParticipant("Alex", "unknownRoom");
        return false;
      } catch {
        return true;
      }
    })(),
    expected: true
  },
  {
    name: "New participant can join the office",
    actual: (() => {
      engine.addParticipant("NewGuest", {
        roomId: "workspace",
        x: 0.25,
        y: 0.25
      });
      return engine.getParticipant("NewGuest") !== null;
    })(),
    expected: true
  },
  {
    name: "Participant can leave the office",
    actual: (() => {
      return engine.removeParticipant("NewGuest") &&
        engine.getParticipant("NewGuest") === null;
    })(),
    expected: true
  },
  {
    name: "Leaving an unknown participant is handled safely",
    actual: engine.removeParticipant("UnknownGuest"),
    expected: false
  }
];


        let passed = 0;

        const lines = tests.map((test, index) => {
          const success = test.actual === test.expected;

          if (success) {
            passed++;
          }

          return `${success ? "PASS" : "FAIL"} — Test ${index + 1}: ${test.name}`;
        });

        lines.push("");
        lines.push(`Result: ${passed}/${tests.length} tests passed.`);

        if (passed === tests.length) {
          lines.push("All room-policy tests passed!");
        } else {
          lines.push("Some tests failed. Check audio-engine.js.");
        }

        output.textContent = lines.join("\n");

      } catch (error) {
        console.error("ProxiSpeak test error:", error);

        output.textContent =
          "ERROR: " + error.message +
          "\n\nCheck that audio-engine.js is saved and has no syntax errors.";
      }
    });
  </script>
</body>
</html>
